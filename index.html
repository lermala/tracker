<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="trackerLayout">
        <aside class="sidebar">
            <div class="sidebarHeader">

                <div class="sidebarUser">
                    <button class="sidebarUserButton" id="sidebarUserButton">
                        <div id="sidebarUserAvatar"></div>
                        <span class="sidebarUserName" id="sidebarUserName"></span>

                        <span class="material-symbols-rounded sidebarUserArrow">
                            expand_more
                        </span>
                    </button>

                    <div class="sidebarUserMenu hidden" id="sidebarUserMenu">

                        <!-- Аккаунт -->
                        <div class="menuSection">
                            <div class="sidebarUserInfo">
                                <div class="sidebarUserMenuName" id="sidebarUserMenuName"></div>

                                <div class="sidebarUserEmail" id="sidebarUserEmail"></div>
                            </div>
                        </div>

                        <!-- Настройки -->
                        <div class="menuSection">
                            <button class="menuItem" id="settingsButton" type="button">
                                <span class="material-symbols-rounded menuItemIcon">
                                    settings
                                </span>

                                <span>Настройки</span>
                            </button>

                            <div class="menuSetting">
                                <div class="toggleButton" id="themeToggle"></div>
                                <span class="menuSettingLabel">
                                    Тёмная тема
                                </span>
                            </div>
                        </div>

                        <!-- Действия -->
                        <div class="menuSection">
                            <button class="menuItem" id="signOutButton" type="button">
                                <span class="material-symbols-rounded menuItemIcon">
                                    logout
                                </span>

                                <span>Выйти</span>
                            </button>
                        </div>

                    </div>
                </div>


                <button class="sidebarToggleButton" id="sidebarToggleButton" title="Свернуть">
                    <span class="material-symbols-rounded">
                        left_panel_close
                    </span>
                </button>
            </div>

            <div class="sidebarContent">
                <div class="sidebarTitle">Личное</div>
                <button class="sidebarNavItem" id="myTasksButton">
                    <span class="material-symbols-rounded sidebarNavIcon">
                        checklist
                    </span>

                    <span class="sidebarNavTitle">Мои задачи</span>
                </button>

                <div class="sidebarTitle">Проекты</div>
                <div class="projectList" id="projectList"></div>

                <button class="addProjectButton sidebarNavItem" id="addProjectButton">
                    <span class="material-symbols-rounded addButtonIcon">
                        add
                    </span>

                    <span>Добавить проект</span>
                </button>

            </div>
        </aside>

        <div class="tasksContainer">
            <div class="tasksHeader">
                <h1 class="tasksHeaderTitle" id="tasksHeaderTitle"></h1>

                <button class="pageMenuButton" id="pageMenuButton" type="button" title="Ещё">
                    <span class="material-symbols-rounded">
                        more_horiz
                    </span>
                </button>
            </div>

            <div class="trackerToolbar" id="trackerToolbar">
                <div class="segmentedControl" id="viewSwitcher">
                    <button class="segmentedControlButton" data-view="list">
                        Список
                    </button>

                    <button class="segmentedControlButton" data-view="board">
                        Доска
                    </button>

                    <button class="segmentedControlButton" data-view="calendar">
                        Календарь
                    </button>
                </div>

                <div class="toolbarActions">
                    <button class="toolbarAction" id="propertiesButton" type="button">
                        <span>Теги</span>
                    </button>

                    <button class="toolbarAction" id="groupButton" type="button">
                        <span>Группировка</span>
                    </button>

                    <button class="toolbarAction" id="filterButton" type="button">
                        <span>Фильтр</span>
                    </button>

                    <button class="toolbarAction" id="sortButton" type="button">
                        <span>Сортировка</span>
                    </button>
                </div>
            </div>

            <div class="dropdown hidden" id="propertiesMenu"></div>

            <div class="dropdown hidden" id="groupMenu"></div>

            <div class="dropdown hidden" id="filterMenu">
                <label class="dropdownItem">
                    <input class="checkbox" id="hideCompletedCheckbox" type="checkbox">

                    <span class="dropdownItemText">
                        Скрыть завершённые
                    </span>
                </label>
            </div>

            <div class="dropdown hidden" id="sortMenu"></div>

            <div id="trackerView" class="trackerView"></div>
        </div>
    </div>

    <template id="taskTemplate">
        <div class="task">
            <div class="taskCheckbox">
                <span class="material-symbols-rounded">
                    check
                </span>
            </div>
            <div class="taskContent">
                <div class="taskTitle"></div>

                <div class="taskMeta">
                    <div class="taskProperties"></div>
                </div>


            </div>
            <button class="deleteButton">
                <span class="material-symbols-rounded">delete</span>
            </button>
        </div>
    </template>

    <template id="taskGroupTemplate">
        <section class="taskGroup">
            <header class="taskGroupHeader">
                <div class="taskGroupInfo">
                    <span class="taskGroupTitle"></span>
                    <span class="taskGroupCounter"></span>
                    <button class="taskGroupDeleteButton">
                        <span class="material-symbols-rounded">delete</span>
                    </button>
                </div>
            </header>

            <div class="taskGroupItems"></div>

            <button class="taskGroupAddButton addButton">
                <span class="addButtonIcon">+</span>
                <span>Добавить задачу</span>
            </button>

            <div class="taskGroupDropZone"></div>
        </section>
    </template>

    <template id="addCategoryTemplate">
        <button class="addCategoryButton" type="button">
            <span class="addButtonIcon">+</span>
            <span>Добавить раздел</span>
        </button>
    </template>

    <template id="projectEditorTemplate">
        <div class="projectEditorOverlay">
            <div class="projectEditor">
                <div class="projectEditorHeader">
                    <h2 class="projectEditorTitle"></h2>

                    <button class="projectEditorCloseButton" type="button">
                        <span class="material-symbols-rounded">
                            close
                        </span>
                    </button>
                </div>

                <div class="projectEditorContent">
                    <label class="projectEditorField">
                        <span class="projectEditorLabel">
                            Название
                        </span>

                        <input class="projectEditorName" type="text" maxlength="120">
                    </label>

                    <label class="projectEditorField">
                        <span class="projectEditorLabel">
                            Описание
                        </span>

                        <textarea class="projectEditorDescription" rows="5"></textarea>
                    </label>

                    <div class="projectEditorField">
                        <span class="projectEditorLabel">
                            Цвет
                        </span>

                        <div class="projectEditorColor"></div>
                    </div>

                    <div class="projectEditorField">
                        <label class="projectEditorLabel">
                            Участники
                        </label>

                        <div class="projectEditorMembers" data-project-members></div>
                    </div>
                </div>

                <div class="projectEditorFooter">
                    <button class="projectEditorCancelButton" type="button">
                        Отмена
                    </button>

                    <button class="projectEditorSaveButton" type="button">
                        Сохранить
                    </button>
                </div>
            </div>
        </div>
    </template>

    <template id="settingsTemplate">
        <div class="settingsOverlay">
            <div class="settingsModal">

                <aside class="settingsSidebar">
                    <div class="settingsSidebarHeader">
                        Настройки
                    </div>

                    <nav class="settingsNav">
                        <button class="settingsNavItem is-active" type="button" data-settings-section="account">
                            <span class="material-symbols-rounded">
                                account_circle
                            </span>

                            <span>Аккаунт</span>
                        </button>

                        <button class="settingsNavItem" type="button" data-settings-section="appearance">
                            <span class="material-symbols-rounded">
                                palette
                            </span>

                            <span>Оформление</span>
                        </button>
                    </nav>
                </aside>

                <div class="settingsMain">

                    <div class="settingsHeader">
                        <h2 class="settingsTitle">
                            Аккаунт
                        </h2>

                        <button class="settingsCloseButton" type="button">
                            <span class="material-symbols-rounded">
                                close
                            </span>
                        </button>
                    </div>

                    <div class="settingsContent">

                        <section class="settingsSection" data-settings-content="account">
                            <div class="settingsAvatarField">

                                <div class="settingsAvatarPreview"></div>

                                <div class="settingsAvatarActions">
                                    <input class="settingsAvatarInput" type="file"
                                        accept="image/png,image/jpeg,image/webp" hidden>

                                    <button class="settingsAvatarChangeButton" type="button">
                                        Изменить фото
                                    </button>

                                    <button class="settingsAvatarDeleteButton" type="button">
                                        Удалить
                                    </button>

                                    <div class="settingsAvatarHint">
                                        JPG, PNG или WebP. Максимум 4 МБ.
                                    </div>
                                </div>

                            </div>

                            <div class="settingsField">
                                <span class="settingsLabel">
                                    Имя
                                </span>

                                <input class="settingsNameInput" type="text" maxlength="120">
                            </div>
                        </section>

                        <section class="settingsSection hidden" data-settings-content="appearance">
                            <div class="settingsField">
                                <span class="settingsLabel">
                                    Тёмная тема
                                </span>

                                <div id="settingsThemeToggle"></div>
                            </div>

                            <div class="settingsField">
                                <span class="settingsLabel">
                                    Акцентный цвет
                                </span>

                                <div id="settingsAccentColorPicker"></div>
                            </div>
                        </section>

                    </div>

                    <div class="settingsFooter">
                        <button class="settingsCancelButton" type="button">
                            Отмена
                        </button>

                        <button class="settingsSaveButton" type="button">
                            Сохранить
                        </button>
                    </div>

                </div>
            </div>
        </div>
    </template>

</body>
