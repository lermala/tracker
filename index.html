<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracker</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="trackerLayout">
        <aside class="sidebar">
            <div class="sidebarHeader">
                <span class="sidebarTitle">Проекты</span>

                <button class="sidebarToggleButton" id="sidebarToggleButton" title="Свернуть">
                    <span class="material-symbols-rounded">
                        left_panel_close
                    </span>
                </button>
            </div>

            <div class="projectList" id="projectList"></div>

            <button class="addProjectButton" id="addProjectButton">
                <span class="material-symbols-rounded">
                    add
                </span>

                <span>Добавить проект</span>
            </button>
        </aside>

        <div class="tasksContainer">
            <div class="trackerToolbar" id="trackerToolbar">
                <!-- переключатель Список / Доска / Календарь -->
                <div class="segmentedControl" id="viewSwitcher">
                    <button class="segmentedControlButton" data-view="list">
                        Список
                    </button>

                    <button class="segmentedControlButton" data-view="board">
                        Доска
                    </button>

                    <button class="segmentedControlButton" data-view="calendar">
                        Календарь
                    </button>
                </div>

                <!-- настройки (шестеренка) -->
                <div class="settingsGroup">
                    <button class="settingsButton" id="settingsButton" title="Настройки">
                        <span class="material-symbols-rounded">
                            settings
                        </span>
                    </button>

                    <div class="settingsMenu hidden" id="settingsMenu">
                        <div class="settingsMenuTitle">
                            Настройки
                        </div>

                        <!-- Группировка -->
                        <div class="settingsItem">
                            <div class="settingsItemLabel">
                                Группировка
                            </div>

                            <button class="settingsSelect" id="groupButton">
                                <span id="groupButtonValue">Нет</span>
                                <span class="material-symbols-rounded">
                                    expand_more
                                </span>
                            </button>

                            <div class="settingsSelectMenu hidden" id="groupMenu"></div>
                        </div>

                        <!-- Сортировка -->
                        <div class="settingsItem">
                            <div class="settingsItemLabel">
                                Сортировка
                            </div>

                            <button class="settingsSelect" id="sortButton">
                                <span id="sortButtonValue">Дата создания</span>
                                <span class="material-symbols-rounded">
                                    expand_more
                                </span>
                            </button>

                            <div class="settingsSelectMenu hidden" id="sortMenu"></div>
                        </div>

                        <!-- Другое -->
                        <div class="settingsItem settingsCheckboxItem">
                            <label class="settingsCheckbox">
                                <input type="checkbox" id="hideCompletedCheckbox">
                                <span>Скрыть завершенные</span>
                            </label>
                        </div>

                        <div class="settingsItem settingsCheckboxItem">
                            <label class="settingsCheckbox">
                                <input type="checkbox" id="todayOnlyCheckbox">
                                <span>Только сегодня</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tasksHeader">
                <h1 class="tasksHeaderTitle" id="tasksHeaderTitle"></h1>
            </div>

            <div id="trackerView" class="trackerView"></div>
        </div>
    </div>

    <template id="taskTemplate">
        <div class="task">
            <div class="taskCheckbox">
                <span class="material-symbols-rounded">
                    check
                </span>
            </div>
            <div class="taskContent">
                <div class="taskTitle"></div>

                <div class="taskMeta">
                    <div class="timerControl">
                        <button class="timerButton">
                            <span class="material-symbols-rounded">play_circle</span>
                        </button>
                        <span class="taskDuration"></span>
                    </div>
                    <div class="taskDueAt"></div>
                </div>
            </div>
            <button class="deleteButton">
                <span class="material-symbols-rounded">delete</span>
            </button>
        </div>
    </template>

    <template id="taskGroupTemplate">
        <section class="taskGroup">
            <header class="taskGroupHeader">
                <div class="taskGroupInfo">
                    <span class="taskGroupTitle"></span>
                    <span class="taskGroupCounter"></span>
                    <button class="taskGroupDeleteButton">
                        <span class="material-symbols-rounded">delete</span>
                    </button>
                </div>
            </header>

            <div class="taskGroupItems"></div>

            <button class="taskGroupAddButton addButton">
                <span class="addButtonIcon">+</span>
                <span>Добавить задачу</span>
            </button>

            <div class="taskGroupDropZone"></div>
        </section>
    </template>

    <template id="addCategoryTemplate">
        <button class="addCategoryButton" type="button">
            <span class="addButtonIcon">+</span>
            <span>Добавить раздел</span>
        </button>
    </template>

</body>

<!-- ===== Libs ===== -->

<script src="js/tracker/ui/components/datePicker.js"></script>
<script src="js/tracker/ui/components/calendar.js"></script>
<script src="js/tracker/ui/components/textEditor.js"></script>


<!-- ===== Utils ===== -->
<script src="js/utils/dateUtils.js"></script>


<!-- ===== Tracker: UI Components ===== -->
<script src="js/tracker/ui/animations.js"></script>
<script src="js/tracker/ui/dragDrop.js"></script>

<script src="js/tracker/ui/sidebarUI.js"></script>
<script src="js/tracker/ui/toolbarUI.js"></script>
<script src="js/tracker/ui/settingsUI.js"></script>

<script src="js/tracker/ui/taskFields.js"></script>
<script src="js/tracker/ui/taskUI.js"></script>
<script src="js/tracker/ui/taskCard.js"></script>
<script src="js/tracker/ui/categoryUI.js"></script>
<script src="js/tracker/ui/taskGroupUI.js"></script>
<script src="js/tracker/ui/editor.js"></script>


<!-- ===== Tracker: Views ===== -->
<script src="js/tracker/views/listView.js"></script>
<script src="js/tracker/views/boardView.js"></script>
<script src="js/tracker/views/calendarView.js"></script>

<!-- ===== Tracker: Services ===== -->
<script src="js/tracker/services/projectService.js"></script>
<script src="js/tracker/services/categoryService.js"></script>
<script src="js/tracker/services/taskService.js"></script>
<script src="js/tracker/services/taskQuery.js"></script>

<!-- ===== Tracker: UI Controller ===== -->
<script src="js/tracker/ui/trackerUI.js"></script>

<!-- ===== Timer ===== -->

<!-- ===== App ===== -->
<script src="js/tracker/tracker.js"></script>

</html>
