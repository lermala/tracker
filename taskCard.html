<div class="taskCardOverlay hidden" id="taskCardOverlay">
    <div class="taskCard">

        <div class="taskCardHeader">
            <button class="taskCardCloseButton" id="taskCardCloseButton">
                <span class="material-symbols-rounded">
                    close
                </span>
            </button>
        </div>

        <div class="taskCardLayout">
            <!-- Левая часть -->
            <div class="taskCardContent">
                <div class="taskCardMain">
                    <div class="taskCheckbox" id="taskCardCheckbox">
                        <span class="material-symbols-rounded">
                            check
                        </span>
                    </div>

                    <div class="taskCardBody">
                        <div class="taskCardTitle" id="taskCardTitle">
                        </div>

                        <div class="taskCardDescriptionWrapper">
                            <div class="markdownContent taskCardDescription" id="taskCardDescription"></div>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Правая часть -->
            <aside class="taskCardProperties">

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Срок
                    </div>
                    <div class="taskDueDate" id="taskCardDueDate"></div>
                </div>

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Таймер
                    </div>

                    <div id="taskCardDuration"></div>
                </div>

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Исполнитель
                    </div>

                    <div class="taskCardUser" id="taskCardAssignee"></div>
                </div>

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Создатель
                    </div>

                    <div class="taskCardUser" id="taskCardCreator"></div>
                </div>

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Приоритет
                    </div>
                    <div class="taskPriority" id="taskCardPriority">
                        <span class="priorityDot taskPriorityDot"></span>
                        <span class="taskPriorityText"></span>
                    </div>
                </div>

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Проект
                    </div>

                    <div id="taskCardProject"></div>
                </div>

                <div class="taskCardProperty">
                    <div class="taskCardPropertyLabel">
                        Категория
                    </div>

                    <div id="taskCardCategory"></div>
                </div>

            </aside>

        </div>

    </div>
</div>
